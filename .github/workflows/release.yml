# 打了 v* 的 tag 就构建并发一个 Release。
#
# 为什么要有这个:发版原来是在本机跑 packaging\build_win.ps1、再手动把 zip 拖到
# GitHub 网页上。两个毛病 —— 一是每次都得记着做,忘了的话 tag 在那儿而 Release
# 是空的,应用里的「检查更新」就永远找不到包;二是构建结果跟着这台机器的
# Anaconda 环境走,换台机器出来的东西不一定一样。
#
# 交给 Actions 之后:打 tag = 出包。用的是 runner 自带的 GITHUB_TOKEN,
# 不碰任何人的个人凭据。
#
# **资产名不能改。** updater.py 按 `NEU-Helper-win-x64.zip` 这个名字找下载地址
# (见 _asset_name),改了名应用就更新不了 —— build_win.ps1 生成的就是这个名字。

name: release

on:
  push:
    tags: ['v*']
  # 手动也能跑一次,用来验证工作流本身没坏(不发 Release)
  workflow_dispatch:

permissions:
  contents: write          # 建 Release 要写权限

env:
  # runner 的控制台代码页不是 UTF-8。项目里的 Python 脚本打的是中文进度,
  # 不开这个的话 print 直接 UnicodeEncodeError、退出码 1,构建步骤就"失败"了
  # —— 第一次跑这个工作流就是这么挂的,而报错完全不指向真正的原因。
  # (脚本自己也加了 errors="replace" 兜底,这里是为了让日志还能读。)
  PYTHONUTF8: '1'

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 默认是深度 1,那样 `git describe` 找不到上一个 tag,
          # compare 链接就拼不出来
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # requests = Canvas API,flask = 本地后端,pywebview = 窗口。
      # 和 install.ps1 里装的是同一份清单。
      - name: install deps
        run: python -m pip install --upgrade pip pyinstaller requests flask pywebview

      # version.py 是版本号唯一的来源。它和 tag 对不上的话,应用里的更新检查会
      # 永远错在一个方向上("总是最新"或者"总有更新"),而且极难从用户的报告里查出来。
      # 所以在这儿拦住,别让它发出去。
      - name: version must match the tag
        shell: bash
        run: |
          ver=$(python -c "import version; print(version.VERSION)")
          tag="${GITHUB_REF_NAME#v}"
          echo "version.py = $ver   tag = $tag"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$ver" != "$tag" ]; then
            echo "::error::version.py says $ver but the tag says $tag"
            exit 1
          fi

      - name: build
        run: powershell -ExecutionPolicy Bypass -File packaging\build_win.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: NEU-Helper-win-x64
          path: dist/NEU-Helper-win-x64.zip

      # Hand-written release notes live in packaging/notes/<tag>.md. They matter
      # more than they look: updater.py pulls the release body into the app and
      # shows it behind the "what changed" button, so an empty body means the
      # user who just updated is told nothing.
      #
      # First line of the file is the release title (drop the leading "# ").
      # No file -> fall back to the auto-generated changelog, which is better
      # than nothing but should be the exception.
      - name: read the release notes
        if: github.ref_type == 'tag'
        id: notes
        shell: bash
        run: |
          # **写进工作区,不要写 /tmp。** 这是 Windows runner:bash 步骤看到的
          # /tmp 是 Git Bash 自己那套 MSYS 路径,而下面那个 action 是 Node 写的,
          # 它把 body_path 当普通 Windows 路径解释 —— 两边根本不是同一个目录,
          # 文件"明明写出来了"却读不到。第一次就是这么悄悄退回自动 changelog 的
          # (所有步骤还都是绿的)。相对路径由 action 按工作区解析,不会错。
          f="packaging/notes/${GITHUB_REF_NAME}.md"
          if [ -f "$f" ]; then
            title=$(head -1 "$f" | sed 's/^#* *//')
            tail -n +2 "$f" > release-body.md
            echo "found notes: $f"
          else
            echo "::warning::no $f - the release will go out with only a changelog link"
            title="${GITHUB_REF_NAME}"
            : > release-body.md
          fi
          # 自己拼 compare 链接,不用 generate_release_notes —— 那个开关在"更新
          # 已存在的 Release"这条路上会把正文整个换掉,正是上面要避免的事
          prev=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          if [ -n "$prev" ]; then
            printf '\n---\n\n**Full Changelog**: %s/%s/compare/%s...%s\n' \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$prev" "$GITHUB_REF_NAME" >> release-body.md
          fi
          echo "title=$title" >> "$GITHUB_OUTPUT"
          echo "body is $(wc -c < release-body.md) bytes"

      # 用预装的 gh,不用第三方 action。
      #
      # 为什么换掉 softprops/action-gh-release:它在**创建**Release 时认
      # body_path,在**更新已存在的**那条路上却不认 —— 正文原样保留。而重打
      # 一个 tag(修了 CI 再发一次,这一版就干了四回)走的正是更新那条路。
      # 表现是所有步骤全绿、Release 的配文却一直是旧的,没有任何一处报错。
      #
      # gh 的每一步做什么写在脸上,出问题也看得见。
      - name: publish the release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ steps.notes.outputs.title }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          zip=dist/NEU-Helper-win-x64.zip
          echo "title: $TITLE"
          echo "body:  $(wc -c < release-body.md) bytes"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release exists -> updating"
            gh release edit "$tag" --title "$TITLE" --notes-file release-body.md
            gh release upload "$tag" "$zip" --clobber
          else
            echo "creating the release"
            gh release create "$tag" --title "$TITLE" --notes-file release-body.md "$zip"
          fi
          # 发完回头读一遍。正文没写进去就当场失败 —— 上一次正是"绿着但没生效"
          got=$(gh release view "$tag" --json body --jq '.body | length')
          echo "the release body now has $got characters"
          if [ "$got" -lt 100 ]; then
            echo "::error::the release body did not take"
            exit 1
          fi
