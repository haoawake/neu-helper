# 打了 v* 的 tag 就构建并发一个 Release。
#
# 为什么要有这个:发版原来是在本机跑 packaging\build_win.ps1、再手动把 zip 拖到
# GitHub 网页上。两个毛病 —— 一是每次都得记着做,忘了的话 tag 在那儿而 Release
# 是空的,应用里的「检查更新」就永远找不到包;二是构建结果跟着这台机器的
# Anaconda 环境走,换台机器出来的东西不一定一样。
#
# 交给 Actions 之后:打 tag = 出包。用的是 runner 自带的 GITHUB_TOKEN,
# 不碰任何人的个人凭据。
#
# **资产名不能改。** updater.py 按固定的名字找下载地址(见 _asset_name):
#     Windows   NEU-Helper-win-x64.zip
#     macOS     NEU-Helper-mac-<arch>.zip      arch = platform.machine()
# 改了名应用就更新不了。两个构建脚本生成的正是这两个名字。
#
# ── 三个 job,为什么这么分 ──
#
# windows / macos 各自构建,publish 收拢起来发一次。原来 publish 是 windows
# 那个 job 里的最后一步;加了 macOS 之后必须拆开,否则没法等两边都出包。
#
# **publish 的门是 `needs.windows.result == 'success'`,不是 needs 默认那套。**
#
# 这一条是踩了坑才写死的。原来写的是 `needs: [windows, macos]` 加
# `continue-on-error: true`(挂在 macos 上),以为这样 mac 挂了也不影响发布 ——
# **错了。** job 级别的 continue-on-error 只是"不把整个 run 标红",
# 那个 job 的 conclusion 仍然是 failure,于是 `needs` 它的 job 照样被**跳过**。
#
# 两个一起的后果是最坏的那种:mac 那条腿一挂,publish 直接不跑、
# 一个 Release 都不发,而 run 看着还不红。v3.4.0 和 v3.5.0 就是这么
# "推上去了但没发布"的 —— tag 在,Release 没有,没有任何一处报错。
#
# 现在:publish 用 `if: always()` 自己判门,只要 windows 成了就发;
# 而 macos **不再** continue-on-error —— 它挂了 run 就是红的(该看见),
# 但发布照走。

name: release

on:
  push:
    tags: ['v*']
  # 手动也能跑一次,用来验证工作流本身没坏(不发 Release)
  workflow_dispatch:

permissions:
  contents: write          # 建 Release 要写权限

env:
  # runner 的控制台代码页不是 UTF-8。项目里的 Python 脚本打的是中文进度,
  # 不开这个的话 print 直接 UnicodeEncodeError、退出码 1,构建步骤就"失败"了
  # —— 第一次跑这个工作流就是这么挂的,而报错完全不指向真正的原因。
  # (脚本自己也加了 errors="replace" 兜底,这里是为了让日志还能读。)
  PYTHONUTF8: '1'

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # requests = Canvas API,flask = 本地后端,pywebview = 窗口。
      # 和 install.ps1 里装的是同一份清单。
      - name: install deps
        run: python -m pip install --upgrade pip pyinstaller requests flask pywebview

      # version.py 是版本号唯一的来源。它和 tag 对不上的话,应用里的更新检查会
      # 永远错在一个方向上("总是最新"或者"总有更新"),而且极难从用户的报告里查出来。
      # 所以在这儿拦住,别让它发出去。
      #
      # **只在这个 job 里查一次就够。** publish 要等 windows 成功才跑,
      # 所以对不上的话整条线根本走不到发布那一步。
      - name: version must match the tag
        shell: bash
        run: |
          ver=$(python -c "import version; print(version.VERSION)")
          tag="${GITHUB_REF_NAME#v}"
          echo "version.py = $ver   tag = $tag"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$ver" != "$tag" ]; then
            echo "::error::version.py says $ver but the tag says $tag"
            exit 1
          fi

      - name: regression tests
        run: python -m unittest discover -s tests -v

      - name: build
        run: powershell -ExecutionPolicy Bypass -File packaging\build_win.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-win
          path: dist/NEU-Helper-win-x64.zip
          if-no-files-found: error

  macos:
    # **只有 Apple 芯片。** 原来这儿是 `[macos-14, macos-13]`,想顺手把
    # Intel 的包也出了 —— 但 GitHub 已经下线了 Intel 的 macOS runner:
    # 那条腿两次运行里压根没出现过(job 列表里只有 `macos (macos-14)`),
    # 而"有一条腿没成"就足以让 publish 被跳过。
    #
    # 所以 Intel Mac 没有预构建包,只能自己跑 packaging/build_mac.sh。
    # README 和 updater 的报错里都写明了。
    #
    # 钉死 macos-14 而不是 macos-latest:latest 哪天挪到别的架构,
    # 出来的包名字就变了,而那个名字是自动更新认的
    # (updater._asset_name 按 platform.machine() 找)。
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # 依赖装在脚本里(它要照顾"Homebrew 的 python 不让 pip install"那种情况),
      # 这里只把它跑起来。产物是 dist/NEU-Helper-mac-<arch>.zip
      - name: build
        run: |
          chmod +x packaging/build_mac.sh
          ./packaging/build_mac.sh

      - name: regression tests
        run: python3 -m unittest discover -s tests -v

      - name: what came out
        run: ls -la dist/*.zip

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-mac
          path: dist/NEU-Helper-mac-*.zip
          if-no-files-found: error

  publish:
    needs: [windows, macos]
    # **always() 加自己判门。** 见文件开头那段:不这么写的话 macos 一挂,
    # 这个 job 会被静静跳过,于是"tag 推上去了但没有 Release",
    # 而且哪儿都不报错。Windows 的包是底线,它成了就必须发出去。
    if: always() && github.ref_type == 'tag' && needs.windows.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 默认是深度 1,那样 `git describe` 找不到上一个 tag,
          # compare 链接就拼不出来
          fetch-depth: 0

      # 不写 name = 把所有 artifact 都下下来,各自一个子目录。
      # macos 挂掉的话就只有 pkg-win,下面的 glob 自然只找到一个包。
      # 不写 name = 把所有 artifact 都下下来。macos 挂了就只有 pkg-win,
      # 下面的 glob 自然只找到一个包 —— 所以这一步不能因为"少了一个"而失败
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: dl

      - name: what we are going to attach
        run: find dl -name '*.zip' -printf '%p  %s bytes\n'

      # 发布说明的**唯一来源是 packaging/release_descriptions.json**
      # ——sync-release-descriptions.yml 用的也是它。
      #
      # 两个工作流都会写 Release 的 name/body。各读各的数据源就会互相覆盖,
      # 而且谁赢取决于谁后跑(打 tag 时这个先跑;改了 JSON 推 main 时那个后跑)。
      # 所以这里也读 JSON,两边永远一致。
      #
      # JSON 里没有这个 tag 时退回 packaging/notes/<tag>.md(早期版本用的
      # 是那套)。两处都没有就只留一个 changelog 链接 —— 那是最差情况:
      # updater.py 会把 Release 正文取进应用里给用户看,空正文等于刚更新完
      # 的人什么也没被告知。
      - name: read the release notes
        id: notes
        run: |
          python packaging/pick_release_notes.py
          title=$(cat release-title.txt)
          echo "title=$title" >> "$GITHUB_OUTPUT"
          echo "title: $title"
          echo "body is $(wc -c < release-body.md) bytes"

      # 用预装的 gh,不用第三方 action。
      #
      # 为什么换掉 softprops/action-gh-release:它在**创建**Release 时认
      # body_path,在**更新已存在的**那条路上却不认 —— 正文原样保留。而重打
      # 一个 tag(修了 CI 再发一次,v3.0.0 那一版就干了四回)走的正是更新那条
      # 路。表现是所有步骤全绿、Release 的配文却一直是旧的,没有任何一处报错。
      #
      # gh 的每一步做什么写在脸上,出问题也看得见。
      - name: publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ steps.notes.outputs.title }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          mapfile -t zips < <(find dl -name '*.zip' | sort)
          echo "title: $TITLE"
          echo "body:  $(wc -c < release-body.md) bytes"
          echo "zips:  ${zips[*]}"
          # **Windows 那个包必须在。** macOS 那一档允许缺(它的 job 是
          # continue-on-error 的),但一个 Release 里连 win 的包都没有的话,
          # 绝大多数人的「检查更新」就等于坏了 —— 宁可让这次发布失败。
          if ! printf '%s\n' "${zips[@]}" | grep -q 'NEU-Helper-win-x64\.zip$'; then
            echo "::error::no Windows zip among the artifacts"
            exit 1
          fi
          if ! printf '%s\n' "${zips[@]}" | grep -q 'NEU-Helper-mac-'; then
            echo "::warning::no macOS zip - that build must have failed"
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            # **--draft=false 不能省。** 删掉一个 tag,GitHub 会把它那个已发布的
            # Release 转成草稿(不是删掉)。重打 tag 之后走到这一支,不显式发布
            # 的话它就一直是草稿 —— 而草稿对没登录的人是**看不见的**,
            # /releases/tags/<tag> 直接 404。表现又是"全绿但线上没有"。
            echo "release exists -> updating"
            gh release edit "$tag" --title "$TITLE" --notes-file release-body.md \
                                   --draft=false --prerelease=false --latest
            gh release upload "$tag" "${zips[@]}" --clobber
          else
            echo "creating the release"
            gh release create "$tag" --title "$TITLE" --notes-file release-body.md "${zips[@]}"
          fi
          # 发完回头读一遍:正文写进去了吗、是不是还草稿着、包挂上了吗。
          # v3.0.0 在"所有步骤全绿而线上不对"上栽了三次,不自己验就还会有第四次。
          got=$(gh release view "$tag" --json isDraft,body,assets \
                  --jq '"\(.isDraft) \(.body|length) \(.assets|length)"')
          echo "isDraft / body chars / assets = $got"
          read -r draft chars assets <<< "$got"
          if [ "$draft" != "false" ] || [ "$chars" -lt 100 ] || [ "$assets" -lt 1 ]; then
            echo "::error::release is not in the state we wanted ($got)"
            exit 1
          fi
